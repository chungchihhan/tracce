[package]
name = "tracce"
version = "0.1.1"
edition = "2021"
description = "macOS kernel-event tracer for Claude Code sessions"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "tracce"
path = "src/main.rs"

[lib]
name = "tracce"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
insta = { version = "1.40", features = ["yaml"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
